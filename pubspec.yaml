name: kilaw_clinic
description: Kilaw Dental Clinic - rekam medis, antrian, catatan klinik (port Flutter dari web app).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.3
  file_picker: ^8.1.2
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ttd.png
