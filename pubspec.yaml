name: livedrive
description: LiveDrive - pengelola file & sinkron Google Drive untuk Kilaw Dental Clinic
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
